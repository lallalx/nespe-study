}.between{justify-content:space-between}.check-row{display:flex;align-items:center;gap:8px;font-size:12px;color:#5d6c80;cursor:pointer}.check-row input{width:17px;height:17px;accent-color:var(--primary)}
    .small-studies{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-bottom:29px}.mode-card{display:flex;flex-direction:column;text-align:left;align-items:flex-start;background:white;padding:18px;border:1px solid var(--line);border-radius:15px;color:var(--ink);min-width:0;transition:.15s}.mode-card:hover{border-color:#9eb0fc;transform:translateY(-1px)}.mode-card .mode-ico{width:36px;height:36px;border-radius:11px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-size:17px;margin-bottom:10px}.mode-card .name{font-weight:800;font-size:14px}.mode-card .detail{color:var(--muted);font-size:12px;margin-top:3px}.mode-card[data-mode="wrong"] .mode-ico{background:var(--bad-soft);color:var(--bad)}.mode-card[data-mode="new"] .mode-ico{background:var(--mint-soft);color:var(--mint)}
    .mini-question{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;border-top:1px solid var(--line);padding:14px 0}.mini-question:first-child{border-top:0;padding-top:0}.mini-question:last-child{padding-bottom:0}.mini-question .q{font-weight:700;line-height:1.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini-question .detail{font-size:12px;color:var(--muted);margin-top:3px}.pill{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:#edf2fa;color:#66748b}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.good{background:var(--mint-soft);color:var(--mint)}.pill.gold{background:var(--gold-soft);color:var(--gold)}.placeholder{color:var(--muted);text-align:center;padding:32px 14px;font-size:13px}.placeholder b{display:block;color:var(--ink);font-size:15px;margin:6px 0}
    .toolbar{padding:17px;display:grid;grid-template-columns:minmax(220px,1fr) minmax(125px,.45fr) minmax(155px,.5fr);gap:10px;margin-bottom:14px}.question-list{display:grid;gap:10px}.list-item{padding:18px 20px}.list-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.list-num{font-size:11px;font-weight:800;color:#7c8ba0}.list-q{margin:0;font-size:15px;font-weight:750;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}.list-answer{font-size:12px;color:var(--muted);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.list-footer{display:flex;align-items:center;gap:7px;justify-content:space-between;border-top:1px solid var(--line);padding-top:13px;margin-top:14px;flex-wrap:wrap}.list-stats{font-size:12px;color:var(--muted);display:flex;gap:13px}.empty-action{text-align:center;padding:42px 18px}.empty-action h3{margin:0 0 5px;font-size:18px}.empty-action p{font-size:13px;color:var(--muted);margin:0 0 18px}.count-label{font-size:12px;color:var(--muted);margin:0 0 10px}
    .editor{max-width:750px;margin:0 auto}.editor .surface{padding:28px}.field{margin-bottom:20px}.field textarea{min-height:126px}.editor .subfield textarea{min-height:95px}.editor .actionbar{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px;margin-top:6px}.tipbox{border-radius:12px;background:#f2f5fc;color:#5d6d86;padding:13px 15px;font-size:12px;margin:0 0 22px;line-height:1.7}.required{color:var(--bad)}

    .settings-stack{display:grid;gap:15px}.settings-stack .surface{padding:22px 25px}.settings-stack h2{margin:0 0 7px;font-size:17px}.settings-stack p{margin:0 0 16px;color:var(--muted);font-size:13px}.settings-stack .soft-note{background:#f5f7fb;padding:14px;border-radius:12px;margin-top:14px;color:#596880;font-size:12px}.warning{color:var(--bad);font-size:12px}.footer{text-align:center;color:#9aa6b5;font-size:11px;margin:48px 0 0}.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%) translateY(20px);padding:12px 20px;background:#1d3049;color:#fff;box-shadow:0 12px 34px #15273f44;border-radius:12px;opacity:0;pointer-events:none;transition:.22s;z-index:20;font-size:13px;white-space:nowrap;max-width:calc(100% - 40px);overflow:hidden;text-overflow:ellipsis}.toast.visible{opacity:1;transform:translateX(-50%) translateY(0)}
    @media(max-width:700px){.shell{padding:0 14px 90px}.topbar{padding:18px 3px 18px}.logo-mark{width:41px;height:41px;border-radius:13px}.logo-copy strong{font-size:16px}.header-tag{font-size:0}.header-tag:before{width:8px;height:8px}.nav{margin-bottom:25px;border-radius:13px}.nav-btn{font-size:12px;padding:11px 2px;border-radius:9px}.heading h1{font-size:23px}.stat-grid{gap:8px;margin-bottom:15px}.stat{padding:14px 12px;border-radius:14px}.stat .meta{font-size:10px}.stat .number{font-size:25px}.stat .foot{font-size:10px}.stat .suffix{font-size:10px}.study-launch{grid-template-columns:1fr;gap:11px;margin-bottom:24px}.launch-intro{padding:21px}.launch-intro h2{font-size:21px}.launch-options{padding:18px}.small-studies{gap:8px;margin-bottom:24px}.mode-card{padding:12px 10px;border-radius:13px}.mode-card .mode-ico{width:31px;height:31px;margin-bottom:8px}.mode-card .name{font-size:12px}.mode-card .detail{font-size:10px;line-height:1.4}.pad{padding:18px}.toolbar{grid-template-columns:1fr 1fr;gap:8px;padding:12px}.toolbar #q-search{grid-column:1/-1}.list-item{padding:15px}.list-q{font-size:14px}.editor .surface{padding:20px 17px}.field-grid{grid-template-columns:1fr}.study-card{padding:22px 20px;min-height:230px}.study-question{font-size:20px;margin:25px 0}.answer-text{font-size:17px}.judgement{gap:8px}.judgement .btn{font-size:13px;min-height:54px;padding:8px}.result-card{padding:32px 15px}.result-numbers{gap:8px}.result-numbers div{padding:13px 18px}.settings-stack .surface{padding:20px 17px}}
    @media(max-width:365px){.small-studies{grid-template-columns:1fr}.mode-card{flex-direction:row;align-items:center;gap:10px}.mode-card .mode-ico{margin:0;flex:none}.nav-btn{font-size:11px}.stat .number{font-size:23px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}

<body>
  <div class="shell">
    <header class="topbar">
      <div class="logo"><div class="logo-mark">NW</div><div class="logo-copy"><strong>ネスペ一問一答</strong><span>自分だけの学習ノート</span></div></div>
      <div class="header-tag" title="データは、このブラウザ内に保存されます"><span id="sync-status">端末内に保存</span></div>
    </header>
    <nav class="nav" aria-label="メインメニュー">
      <button class="nav-btn active" type="button" data-tab="home">ホーム</button>
      <button class="nav-btn" type="button" data-tab="list">問題一覧</button>
      <button class="nav-btn" type="button" data-tab="editor">＋ 問題登録</button>
      <button class="nav-btn" type="button" data-tab="settings">設定・保存</button>
    </nav>
    <main id="app"></main>
    <div class="footer">NETWORK SPECIALIST · PERSONAL STUDY TOOL</div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept=".json,application/json" hidden>
  <input type="file" id="import-csv-file" accept=".csv,text/csv" hidden>
  <script>
  (() => {
    'use strict';
    const KEY = 'nespe_ichimon_ichito_v1';
    const $ = (sel, root=document) => root.querySelector(sel);
    const app = $('#app');
    const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const uid = () => typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : `q-${Date.now()}-${Math.random().toString(36).slice(2)}`;
    let questions = [];
    let activeTab = 'home';
    let editorId = null;
    let session = null;
    let launchMode = 'all';
    let launchLimit = '20';
    let launchShuffle = true;
    let listSearch = '', listFilter = 'all', listSort = 'new';
    let toastTimer;
    let storageOK = true;
    const CONFIG_KEY = 'nespe_supabase_config_v1';
    const SESSION_KEY = 'nespe_supabase_session_v1';
    let cloudConfig = null, cloudSession = null, cloudReady = false;
    let syncBusy = false, syncDirty = false, syncTimer = null, syncError = '';
    function readJSON(key){try{return JSON.parse(localStorage.getItem(key) || 'null');}catch{return null;}}
    function updateSyncLabel(){
      const el=$('#sync-status');if(!el)return;
      el.textContent = !cloudSession ? '端末内に保存' : !cloudReady ? '同期準備中' : syncError ? '同期エラー' : (syncDirty||syncBusy) ? '同期中…' : 'クラウド同期済み';
      el.title=syncError||'設定・保存から同期状態を確認できます';
    }
    function cloudBase(){return cloudConfig?.url?.replace(/\/+$/,'');}
    async function cloudRequest(path,options={}){
      if(!cloudConfig?.url||!cloudConfig?.key)throw Error('Supabaseの設定がありません');
      const headers={'apikey':cloudConfig.key,'Content-Type':'application/json',...(options.headers||{})};
      if(cloudSession?.access_token)headers.Authorization=`Bearer ${cloudSession.access_token}`;
      const resp=await fetch(cloudBase()+path,{...options,headers});
      let data=null;try{data=await resp.json();}catch{}
      if(!resp.ok)throw Error(data?.msg||data?.error_description||data?.message||data?.error||`通信エラー (${resp.status})`);
      return data;
    }
    function storeSession(value){cloudSession=value; if(value)localStorage.setItem(SESSION_KEY,JSON.stringify(value));else localStorage.removeItem(SESSION_KEY);updateSyncLabel();}
    async function ensureToken(){
      if(!cloudSession?.refresh_token)throw Error('ログインしてください');
      if(Date.now() < (cloudSession.expires_at||0)-60000)return;
      const next=await cloudRequest('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:cloudSession.refresh_token})});
      storeSession({...next,expires_at:Date.now()+(next.expires_in||3600)*1000});
    }
    async function readCloud(){
      await ensureToken();
      const res=await cloudRequest('/rest/v1/study_data?select=payload&limit=1',{headers:{'Accept':'application/json'}});
      return Array.isArray(res)&&res.length ? res[0].payload : null;
    }
    async function writeCloud(snapshot){
      await ensureToken();
      const user=cloudSession?.user?.id;if(!user)throw Error('ユーザー情報がありません');
      await cloudRequest('/rest/v1/study_data?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:user,payload:snapshot})});
    }
    function queueSync(){
      if(!cloudReady||!cloudSession)return;
      syncDirty=true;syncError='';updateSyncLabel();
      clearTimeout(syncTimer);syncTimer=setTimeout(flushSync,650);
    }
    async function flushSync(){
      if(!cloudReady||!cloudSession||syncBusy||!syncDirty)return;
      syncBusy=true;syncDirty=false;updateSyncLabel();
      const snapshot={version:1,questions:JSON.parse(JSON.stringify(questions))};
      try{await writeCloud(snapshot);syncError='';}
      catch(err){syncDirty=true;syncError=err.message;console.error('同期失敗:',err);}
      finally{syncBusy=false;updateSyncLabel();if(syncDirty&&!syncError)queueSync();}
    }
    async function pullSync(){
      if(!cloudReady||!cloudSession||syncDirty||syncBusy)return;
      try{
        const remote=await readCloud();
        if(!remote||!Array.isArray(remote.questions))return;
        questions=remote.questions.map(normalize).filter(Boolean);
        localSaveOnly();syncError='';updateSyncLabel();
        if(activeTab!=='editor'&&activeTab!=='study')render();
      }catch(err){syncError=err.message;updateSyncLabel();}
    }
    async function startCloud(){
      if(!cloudSession||!cloudConfig)return;
      cloudReady=false;syncError='';updateSyncLabel();
      try{
        const remote=await readCloud();
        if(remote&&Array.isArray(remote.questions)){
          if(questions.length&&JSON.stringify(questions)!==JSON.stringify(remote.questions)){
            if(confirm(`この端末に ${questions.length} 問、クラウドに ${remote.questions.length} 問あります。\n\n「OK」＝クラウドをこの端末に読み込む（推奨）\n「キャンセル」＝この端末のデータをクラウドに上書きする\n\n不安な場合はキャンセル前にJSONバックアップを保存してください。`)){
              questions=remote.questions.map(normalize).filter(Boolean);localSaveOnly();
            }else{await writeCloud({version:1,questions});}
          }else{questions=remote.questions.map(normalize).filter(Boolean);localSaveOnly();}
        }else if(questions.length){await writeCloud({version:1,questions});}
        cloudReady=true;syncError='';updateSyncLabel();render();notify('クラウド同期を開始しました');
      }catch(err){cloudReady=false;syncError=err.message;updateSyncLabel();notify('同期できません：'+err.message);}
    }
    async function signIn(action){
      const email=$('#cloud-email')?.value.trim(),password=$('#cloud-password')?.value;
      if(!cloudConfig){notify('先に接続設定を保存してください');return;}
      if(!email||!password){notify('メールアドレスとパスワードを入力してください');return;}
      try{
        const path=action==='signup'?'/auth/v1/signup':'/auth/v1/token?grant_type=password';
        const res=await cloudRequest(path,{method:'POST',body:JSON.stringify({email,password})});
        if(!res.access_token){notify('確認メールを開いて認証後、ログインしてください');return;}
        storeSession({...res,expires_at:Date.now()+(res.expires_in||3600)*1000});
        await startCloud();
      }catch(err){notify('認証エラー：'+err.message);}
    }


    function normalize(raw) {
      if (!raw || typeof raw !== 'object' || !String(raw.question ?? '').trim() || !String(raw.answer ?? '').trim()) return null;
      return {
        id: String(raw.id || uid()),
        question: String(raw.question).trim(),
        answer: String(raw.answer).trim(),
        explanation: String(raw.explanation || ''),
        category: String(raw.category || '').trim(),
        correctCount: Math.max(0,Math.min(1000000,Number(raw.correctCount) || 0)),
        wrongCount: Math.max(0,Math.min(1000000,Number(raw.wrongCount) || 0)),
        favorite: !!raw.favorite,
        lastResult: ['correct','wrong'].includes(raw.lastResult) ? raw.lastResult : null,
        lastAttemptAt: Number(raw.lastAttemptAt) || null,
        createdAt: Number(raw.createdAt) || Date.now(),
        updatedAt: Number(raw.updatedAt) || Date.now()
      };
    }
    function load() {
      try {
        const v = localStorage.getItem(KEY);
        const parsed = v ? JSON.parse(v) : null;
        const data = Array.isArray(parsed) ? parsed : parsed?.questions;
        questions = Array.isArray(data) ? data.map(normalize).filter(Boolean) : [];
      } catch (err) {
        console.warn('読み込み失敗', err); storageOK = false;
        questions = [];
      }
    }
    function localSaveOnly() {
      try {localStorage.setItem(KEY, JSON.stringify({version:1, exportedAt:null,questions}));storageOK=true;return true;}
      catch(err){console.error(err);storageOK=false;alert('ブラウザにデータを保存できませんでした。プライベートブラウズや保存容量をご確認ください。必要に応じてJSONバックアップを保存してください。');return false;}
    }
    function save(){const ok=localSaveOnly();if(ok)queueSync();return ok;}

    function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

      </div>`;

    function judge(correct){
      if(!session || !session.revealed || session.judged)return;
      const q=questions.find(q=>q.id===session.ids[session.index]);if(!q)return;

    }
    function advanceStudy(){if(!session)return;session.index++;session.revealed=false;session.judged=false;session.answer=null;if(session.index>=session.ids.length)session.finished=true;renderStudy();window.scrollTo({top:0,behavior:'instant'});}

    function download(text,filename,mime){
      const blob=new Blob([text],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
    }
    const day=()=>new Date().toLocaleDateString('sv-SE');
    function exportJSON(){download(JSON.stringify({app:'nespe-ichimon-ichito',version:1,exportedAt:new Date().toISOString(),questions},null,2),`ネスペ1問1答_バックアップ_${day()}.json`,'application/json;charset=utf-8');notify('JSONバックアップを書き出しました');}
    const quoteCSV = v=>'"'+String(v??'').replace(/"/g,'""')+'"';
    function exportCSV(){const lines=[['問題','答え','分類','解説','正解回数','間違い回数','お気に入り'],...questions.map(q=>[q.question,q.answer,q.category,q.explanation,q.correctCount,q.wrongCount,q.favorite?'1':'0'])];download('\ufeff'+lines.map(cols=>cols.map(quoteCSV).join(',')).join('\r\n'),`ネスペ1問1答_問題一覧_${day()}.csv`,'text/csv;charset=utf-8');notify('CSVを書き出しました');}
    function parseCSV(text){
      const rows=[];let row=[],val='',inside=false;
      text=text.replace(/^\uFEFF/,'');
      for(let i=0;i<text.length;i++){
        const ch=text[i];
        if(ch==='"'){if(inside&&text[i+1]==='"'){val+='"';i++;}else inside=!inside;}
        else if(ch===','&&!inside){row.push(val);val='';}
        else if((ch==='\r'||ch==='\n')&&!inside){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(val);if(row.some(c=>c.trim()))rows.push(row);row=[];val='';}
        else val+=ch;
      }
      if(inside)throw Error('CSVのダブルクォートの対応が取れていません。');
      row.push(val);if(row.some(c=>c.trim()))rows.push(row);
      return rows;
    }
    function importCSV(text){
      const rows=parseCSV(text);if(rows.length<2)throw Error('CSVのデータ行が見つかりません。');
      const headers=rows[0].map(x=>x.trim().toLowerCase());
      const col=(...names)=>headers.findIndex(x=>names.includes(x));
      const qcol=col('問題','question','q'),acol=col('答え','answer','a'),ccol=col('分類','テーマ','category'),ecol=col('解説','explanation','メモ');
      if(qcol<0||acol<0)throw Error('CSVの1行目に「問題」「答え」の見出しが必要です。');
      const existing=new Set(questions.map(q=>q.question+'\u0000'+q.answer));let added=0,skipped=0;
      for(const row of rows.slice(1)){
        const question=(row[qcol]||'').trim(),answer=(row[acol]||'').trim();const sig=question+'\u0000'+answer;
        if(!question||!answer||existing.has(sig)){skipped++;continue;}
        const obj=normalize({question,answer,category:ccol>=0?row[ccol]:'',explanation:ecol>=0?row[ecol]:''});
        questions.push(obj);existing.add(sig);added++;
      }
      if(added)save();render();notify(`${added}問を追加、${skipped}行をスキップしました`);
    }
    function saveForm(){
      const question=$('#question-text')?.value.trim(),answer=$('#answer-text')?.value.trim(),category=$('#category-text')?.value.trim(),explanation=$('#explanation-text')?.value.trim();
      if(!question||!answer){notify('問題と答えは必須です');return;}
      const now=Date.now();let q=questions.find(q=>q.id===editorId);
      if(q){Object.assign(q,{question,answer,category,explanation,updatedAt:now});save();editorId=null;activeTab='list';render();notify('変更を保存しました');}
      else {questions.push(normalize({question,answer,category,explanation,createdAt:now,updatedAt:now}));save();renderEditor();$('#question-text')?.focus();notify(`${questions.length}問目を登録しました`);window.scrollTo({top:0,behavior:'instant'});}
    }
    function onClick(e){
      const btn=e.target.closest('[data-action], [data-tab]');if(!btn)return;
      if(btn.dataset.tab){navigate(btn.dataset.tab);return;}
      const act=btn.dataset.action,id=btn.dataset.id;
      if(act==='go-add'){editorId=null;activeTab='editor';render();window.scrollTo({top:0,behavior:'instant'});$('#question-text')?.focus();}
      else if(act==='quick-mode'){launchMode=btn.dataset.mode;startStudy(launchMode);}
      else if(act==='start')startStudy();
      else if(act==='edit'){editorId=id;activeTab='editor';render();window.scrollTo({top:0,behavior:'instant'});}
      else if(act==='delete'){const q=questions.find(q=>q.id===id);if(q && confirm(`この問題を削除しますか？\n\n${q.question.slice(0,90)}\n\n正誤回数も消え、元に戻せません。`)){questions=questions.filter(x=>x.id!==id);save();renderList();notify('問題を削除しました');}}
      else if(act==='favorite'){const q=questions.find(q=>q.id===id);if(q){q.favorite=!q.favorite;save();renderListItems();notify(q.favorite?'お気に入りに追加しました':'お気に入りを解除しました');}}
      else if(act==='cancel-edit'){editorId=null;activeTab='list';render();}
      else if(act==='reveal'){session.revealed=true;renderStudy();}
      else if(act==='judge-wrong')judge(false);
      else if(act==='judge-correct')judge(true);
      else if(act==='next')advanceStudy();
      else if(act==='abort'){if(session && session.correct+session.wrong>0 && !confirm('学習を終了しますか？\nここまでの正誤記録は保存されています。'))return;session=null;activeTab='home';render();}
      else if(act==='home'){session=null;activeTab='home';render();}
      else if(act==='retry-wrong'){const ids=[...session.wrongIds];startStudy('wrong',ids);}
      else if(act==='cloud-config'){
        const url=$('#cloud-url')?.value.trim().replace(/\/+$/,'');const key=$('#cloud-key')?.value.trim();
        if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)||!key){notify('Project URLと公開可能なキーを確認してください');return;}
        if(key.startsWith('sb_secret_')||key.startsWith('sb_service_')){notify('秘密キーは入力しないでください');return;}
        cloudConfig={url,key};localStorage.setItem(CONFIG_KEY,JSON.stringify(cloudConfig));cloudReady=false;
        storeSession(null);notify('接続設定を保存しました。続けてログインしてください');renderSettings();
      }
      else if(act==='cloud-login')signIn('login');
      else if(act==='cloud-signup')signIn('signup');
      else if(act==='cloud-logout'){cloudReady=false;storeSession(null);renderSettings();notify('ログアウトしました（端末内のデータは残っています）');}
      else if(act==='cloud-pull'){if(syncDirty||syncBusy){notify('同期中です。完了後に再読込してください');}else pullSync().then(()=>notify('クラウドから読み込みました'));}
      else if(act==='export-json')exportJSON();
      else if(act==='export-csv')exportCSV();
      else if(act==='import-json'){$('#import-file').value='';$('#import-file').click();}
      else if(act==='import-csv'){$('#import-csv-file').value='';$('#import-csv-file').click();}
      else if(act==='reset-counts'){if(!questions.length){notify('問題がありません');return;}if(confirm(`全${questions.length}問の正誤記録をゼロに戻しますか？\n問題文・解答は残ります。`)){questions.forEach(q=>{q.correctCount=0;q.wrongCount=0;q.lastResult=null;q.lastAttemptAt=null;});save();render();notify('正誤記録をリセットしました');}}
    }
    document.addEventListener('click',onClick);
    document.addEventListener('submit',e=>{if(e.target.id==='question-form'){e.preventDefault();saveForm();}});
    document.addEventListener('input',e=>{if(e.target.id==='q-search'){listSearch=e.target.value;renderListItems();}});
    document.addEventListener('change',e=>{
      if(e.target.id==='launch-mode')launchMode=e.target.value;
      if(e.target.id==='launch-limit')launchLimit=e.target.value;
      if(e.target.id==='launch-shuffle')launchShuffle=e.target.checked;
      if(e.target.id==='q-filter'){listFilter=e.target.value;renderListItems();}
      if(e.target.id==='q-sort'){listSort=e.target.value;renderListItems();}
    });
    $('#import-file').addEventListener('change',async e=>{
      const file=e.target.files?.[0];if(!file)return;
      try{
        const obj=JSON.parse(await file.text());const arr=Array.isArray(obj)?obj:obj?.questions;
        if(!Array.isArray(arr)||!arr.length)throw Error('問題データの配列がありません。');
        if(arr.length>10000)throw Error('問題数が多すぎます（上限10,000問）。');
        const normalized=arr.map(normalize);
        if(normalized.some(q=>!q))throw Error('問題または答えが空のデータがあります。');
        if(!confirm(`バックアップの ${normalized.length} 問を読み込みますか？\n\n現在の ${questions.length} 問をすべて置き換えます。必要なら先にバックアップを保存してください。`))return;
        questions=normalized;save();activeTab='home';render();notify(`${questions.length}問のデータを復元しました`);
      }catch(err){alert(`読み込みに失敗しました：${err.message}`);}
    });
    $('#import-csv-file').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{importCSV(await file.text());}catch(err){alert(`CSV読み込みに失敗しました：${err.message}`);}});
    load();cloudConfig=readJSON(CONFIG_KEY);cloudSession=readJSON(SESSION_KEY);render();updateSyncLabel();
    if(cloudConfig&&cloudSession)startCloud();
    window.addEventListener('focus',()=>{if(cloudReady)pullSync();});
    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cloudReady)pullSync();});
    setInterval(()=>{if(cloudReady&&!document.hidden)pullSync();},45000);
    window.addEventListener('online',()=>{if(cloudReady){if(syncDirty)flushSync();else pullSync();}});
    if(!storageOK)notify('このブラウザでは保存が制限されている可能性があります');
  })();
  </script>
</body>
